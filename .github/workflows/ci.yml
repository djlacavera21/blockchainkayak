name: Validate rental ledger
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            chaincode/package-lock.json
      - run: npm ci
      - run: npm --prefix chaincode ci
      - run: npm run check
      - run: npm test
      - if: matrix.node == 24
        run: npx playwright install --with-deps chromium
      - if: matrix.node == 24
        run: npm run test:browser
      - if: failure() && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-images
          path: test-results/
